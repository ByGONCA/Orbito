<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: ws: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http:; style-src 'self' 'unsafe-inline' http:; img-src 'self' data: https: http: blob:; font-src 'self' data:; connect-src 'self' ws: http: https:;"
    />
    <title>AI Workspace</title>
    <style>
      /* Initial zero-latency launch splash styling */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #101113;
        color: #ECEDEF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }

      #preloader-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: #101113;
        position: relative;
        z-index: 9999;
      }

      .preloader-card {
        width: 380px;
        max-width: 90vw;
        padding: 24px;
        background: transparent;
        border: none;
        box-shadow: none;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .preloader-icon-wrap {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preloader-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ECEDEF;
      }

      .preloader-subtitle {
        font-size: 12px;
        color: #747982;
        margin-top: -8px;
      }

      .preloader-bar-bg {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .preloader-bar-fill {
        height: 100%;
        width: 35%;
        background: #ECEDEF;
        border-radius: 999px;
        animation: preloader-indeterminate 1.4s infinite ease-in-out;
      }

      @keyframes preloader-indeterminate {
        0% {
          transform: translateX(-100%);
          width: 30%;
        }
        50% {
          transform: translateX(100%);
          width: 60%;
        }
        100% {
          transform: translateX(250%);
          width: 30%;
        }
      }

      .preloader-error-box {
        display: none;
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 8px;
        color: #f87171;
        font-size: 11px;
        text-align: left;
        font-family: monospace;
        word-break: break-all;
        max-height: 120px;
        overflow-y: auto;
      }

      .preloader-btn {
        margin-top: 10px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ECEDEF;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .preloader-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body class="bg-[#101113] text-[#ECEDEF] antialiased overflow-hidden select-none">
    <div id="root">
      <div id="preloader-splash">
        <div class="preloader-card">
          <div class="preloader-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECEDEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="preloader-title">AI Workspace</div>
          <div class="preloader-subtitle" id="preloader-text">A inicializar ambiente de trabalho...</div>
          <div class="preloader-bar-bg" id="preloader-bar-wrap">
            <div class="preloader-bar-fill"></div>
          </div>
          <div class="preloader-error-box" id="preloader-error"></div>
          <button class="preloader-btn" id="preloader-reload-btn" style="display: none;" onclick="window.location.reload()">
            Recarregar Aplicação
          </button>
        </div>
      </div>
      <script>
        // Early fatal error trap before React mounts
        window.addEventListener('error', function (e) {
          var errBox = document.getElementById('preloader-error');
          var bar = document.getElementById('preloader-bar-wrap');
          var text = document.getElementById('preloader-text');
          var btn = document.getElementById('preloader-reload-btn');
          if (errBox && text) {
            text.textContent = 'Erro fatal no carregamento inicial';
            text.style.color = '#f87171';
            errBox.style.display = 'block';
            errBox.textContent = e.message || 'Erro desconhecido ao carregar scripts';
            if (bar) bar.style.display = 'none';
            if (btn) btn.style.display = 'inline-block';
          }
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: ws: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http:; style-src 'self' 'unsafe-inline' http:; img-src 'self' data: https: http: blob:; font-src 'self' data:; connect-src 'self' ws: http: https:;"
    />
    <title>Orbito</title>
    <link rel="icon" type="image/png" href="/Orbit.png" />
    <style>
      /* Initial zero-latency launch splash styling */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #101113;
        color: #ECEDEF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }

      #preloader-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: #101113;
        position: relative;
        z-index: 9999;
      }

      .preloader-card {
        width: 380px;
        max-width: 90vw;
        padding: 24px;
        background: transparent;
        border: none;
        box-shadow: none;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .preloader-icon-wrap {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preloader-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ECEDEF;
      }

      .preloader-subtitle {
        font-size: 12px;
        color: #747982;
        margin-top: -8px;
      }

      .preloader-bar-bg {
        width: 220px;
        max-width: 80vw;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin: 6px auto 0;
      }

      .preloader-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(236, 237, 239, 0.25) 20%,
          #ECEDEF 50%,
          rgba(236, 237, 239, 0.25) 80%,
          transparent 100%
        );
        animation: preloader-fluid 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }

      @keyframes preloader-fluid {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .preloader-error-box {
        display: none;
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: 8px;
        color: #f87171;
        font-size: 11px;
        text-align: left;
        font-family: monospace;
        word-break: break-all;
        max-height: 120px;
        overflow-y: auto;
      }

      .preloader-btn {
        margin-top: 10px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ECEDEF;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .preloader-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body class="bg-[#101113] text-[#ECEDEF] antialiased overflow-hidden select-none">
    <div id="root">
      <div id="preloader-splash">
        <div class="preloader-card">
          <div class="preloader-icon-wrap">
            <img src="/Orbit.png" alt="Orbito" width="34" height="34" style="object-fit: contain;" />
          </div>
          <div class="preloader-title">Orbito</div>
          <div class="preloader-subtitle" id="preloader-text">A inicializar ambiente de trabalho...</div>
          <div class="preloader-bar-bg" id="preloader-bar-wrap">
            <div class="preloader-bar-fill"></div>
          </div>
          <div class="preloader-error-box" id="preloader-error"></div>
          <button class="preloader-btn" id="preloader-reload-btn" style="display: none;" onclick="window.location.reload()">
            Recarregar Aplicação
          </button>
        </div>
      </div>
      <script>
        // Early fatal error trap before React mounts
        window.addEventListener('error', function (e) {
          var errBox = document.getElementById('preloader-error');
          var bar = document.getElementById('preloader-bar-wrap');
          var text = document.getElementById('preloader-text');
          var btn = document.getElementById('preloader-reload-btn');
          if (errBox && text) {
            text.textContent = 'Erro fatal no carregamento inicial';
            text.style.color = '#f87171';
            errBox.style.display = 'block';
            errBox.textContent = e.message || 'Erro desconhecido ao carregar scripts';
            if (bar) bar.style.display = 'none';
            if (btn) btn.style.display = 'inline-block';
          }
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
